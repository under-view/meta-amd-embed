# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-amd-embed"
BBFILE_PATTERN_meta-amd-embed = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-amd-embed = "5"

LAYERDEPENDS_meta-amd-embed = "core"
LAYERSERIES_COMPAT_meta-amd-embed = "wrynose"
